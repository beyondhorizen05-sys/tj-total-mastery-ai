<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator - Jazib's Edition</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-calculator: #1e293b;
            --display-bg: #090d16;
            --text-display: #38bdf8;
            --text-secondary: #94a3b8;
            --btn-num-bg: #334155;
            --btn-num-hover: #475569;
            --btn-op-bg: #f59e0b;
            --btn-op-hover: #d97706;
            --btn-action-bg: #ef4444;
            --btn-action-hover: #dc2626;
            --btn-equals-bg: #3b82f6;
            --btn-equals-hover: #2563eb;
            --text-light: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .calculator-container {
            background-color: var(--bg-calculator);
            width: 100%;
            max-width: 360px;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            border: 1px solid #334155;
        }

        .calculator-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .calculator-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.05em;
        }

        .display {
            background-color: var(--display-bg);
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: right;
            border: 1px solid #1e293b;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .history {
            font-size: 0.85rem;
            color: var(--text-secondary);
            min-height: 1.2rem;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .current-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-display);
            word-break: break-all;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            background-color: var(--btn-num-bg);
            color: var(--text-light);
            font-size: 1.25rem;
            font-weight: 600;
            padding: 16px 0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.15s ease, transform 0.05s ease;
            user-select: none;
        }

        button:hover {
            background-color: var(--btn-num-hover);
        }

        button:active {
            transform: scale(0.96);
        }

        .btn-op {
            background-color: var(--btn-op-bg);
            color: #ffffff;
        }
        .btn-op:hover {
            background-color: var(--btn-op-hover);
        }

        .btn-action {
            background-color: var(--btn-action-bg);
            color: #ffffff;
        }
        .btn-action:hover {
            background-color: var(--btn-action-hover);
        }

        .btn-equals {
            background-color: var(--btn-equals-bg);
            color: #ffffff;
            grid-column: span 2;
        }
        .btn-equals:hover {
            background-color: var(--btn-equals-hover);
        }
    </style>
</head>
<body>

    <div class="calculator-container">
        <div class="calculator-header">
            <span class="calculator-title">CALCULATOR</span>
            <span style="font-size: 0.75rem; color: #38bdf8;">Jazib's Edition ✨</span>
        </div>

        <div class="display">
            <div class="history" id="history"></div>
            <div class="current-value" id="currentValue">0</div>
        </div>

        <div class="keypad">
            <button class="btn-action" onclick="clearCalculator()">AC</button>
            <button class="btn-action" onclick="deleteDigit()">⌫</button>
            <button class="btn-op" onclick="appendOperator('%')">%</button>
            <button class="btn-op" onclick="appendOperator('/')">÷</button>

            <button onclick="appendNumber('7')">7</button>
            <button onclick="appendNumber('8')">8</button>
            <button onclick="appendNumber('9')">9</button>
            <button class="btn-op" onclick="appendOperator('*')">×</button>

            <button onclick="appendNumber('4')">4</button>
            <button onclick="appendNumber('5')">5</button>
            <button onclick="appendNumber('6')">6</button>
            <button class="btn-op" onclick="appendOperator('-')">-</button>

            <button onclick="appendNumber('1')">1</button>
            <button onclick="appendNumber('2')">2</button>
            <button onclick="appendNumber('3')">3</button>
            <button class="btn-op" onclick="appendOperator('+')">+</button>

            <button onclick="appendNumber('0')" style="grid-column: span 2;">0</button>
            <button onclick="appendDecimal()">.</button>
            <button class="btn-equals" onclick="computeResult()">=</button>
        </div>
    </div>

    <script>
        let currentInput = '0';
        let previousInput = '';
        let operator = null;
        let resetScreen = false;

        const currentValDisplay = document.getElementById('currentValue');
        const historyDisplay = document.getElementById('history');

        function updateDisplay() {
            currentValDisplay.textContent = currentInput;
            if (operator !== null) {
                historyDisplay.textContent = `${previousInput} ${formatOperator(operator)}`;
            } else {
                historyDisplay.textContent = '';
            }
        }

        function formatOperator(op) {
            if (op === '*') return '×';
            if (op === '/') return '÷';
            return op;
        }

        function appendNumber(num) {
            if (currentInput === '0' || resetScreen) {
                currentInput = num;
                resetScreen = false;
            } else {
                currentInput += num;
            }
            updateDisplay();
        }

        function appendDecimal() {
            if (resetScreen) {
                currentInput = '0.';
                resetScreen = false;
                updateDisplay();
                return;
            }
            if (!currentInput.includes('.')) {
                currentInput += '.';
                updateDisplay();
            }
        }

        function appendOperator(op) {
            if (operator !== null && !resetScreen) {
                computeResult();
            }
            previousInput = currentInput;
            operator = op;
            resetScreen = true;
            updateDisplay();
        }

        function computeResult() {
            if (operator === null || resetScreen) return;
            
            let prev = parseFloat(previousInput);
            let curr = parseFloat(currentInput);
            let result = 0;

            if (isNaN(prev) || isNaN(curr)) return;

            switch (operator) {
                case '+':
                    result = prev + curr;
                    break;
                case '-':
                    result = prev - curr;
                    break;
                case '*':
                    result = prev * curr;
                    break;
                case '/':
                    if (curr === 0) {
                        currentInput = "Error: Div by zero";
                        currentValDisplay.textContent = currentInput;
                        historyDisplay.textContent = `${previousInput} / 0`;
                        operator = null;
                        resetScreen = true;
                        return;
                    }
                    result = prev / curr;
                    break;
                case '%':
                    result = prev % curr;
                    break;
                default:
                    return;
            }

            // Mitigate floating point drift (NFR3: round to up to 8 decimal places)
            result = Math.round(result * 1e8) / 1e8;

            currentInput = result.toString();
            operator = null;
            previousInput = '';
            resetScreen = true;
            updateDisplay();
        }

        function clearCalculator() {
            currentInput = '0';
            previousInput = '';
            operator = null;
            resetScreen = false;
            updateDisplay();
        }

        function deleteDigit() {
            if (resetScreen || currentInput.startsWith("Error")) {
                clearCalculator();
                return;
            }
            if (currentInput.length > 1) {
                currentInput = currentInput.slice(0, -1);
            } else {
                currentInput = '0';
            }
            updateDisplay();
        }
    </script>
</body>
</html>
