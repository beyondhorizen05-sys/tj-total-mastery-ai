name: TJ compatibility validation
on:
  pull_request:
  push:
    branches:
      - feat/universal-model-compatibility
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run test:e2e
      - run: pnpm run build
      - name: Verify real source API boot and safe read-only functionality
        run: node scripts/source-runtime-smoke.mjs --isolated

  windows-native:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run test:e2e
      - run: pnpm run build
      - name: Verify real Windows source API boot and safe read-only functionality
        run: node scripts/source-runtime-smoke.mjs --isolated
      - run: pnpm run build:desktop

  windows-installer:
    # One Windows package attempt per pushed revision, not a duplicate PR build.
    if: github.event_name == 'push'
    needs: [validate, windows-native]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: node scripts/stage-desktop.mjs
      - name: Verify packaged Node API actually boots and rejects unauthenticated calls
        run: node scripts/windows-desktop-api-smoke.mjs
      - name: Install Tauri Windows packaging CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked
      - name: Build Windows installers
        run: pnpm --filter @tj/desktop run package
      - name: Retain UNVERIFIED installers for clean-machine testing
        uses: actions/upload-artifact@v4
        with:
          name: tj-windows-installers-unverified
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
